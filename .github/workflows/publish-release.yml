# Publishes the app already in this repo (downloads/BCN.apk + latest.json) to the public,
# releases-only prod repo - this source repo is private. BCN updates itself from
# prod/bcn/latest.json, and the install link is
#   https://raw.githubusercontent.com/userxx09-afk/prod/main/bcn/BCN.apk
# Phones still on BAN (from before the rename) check prod/arlo/latest.json, so the same file
# goes there too: it points at bcn/BCN.apk, and they update into BCN.
# It also makes a release there (bcn-v<version>).
# Runs by itself when downloads/ changes on main, or from the Actions tab > Run workflow.
# Needs the PROD_REPO_TOKEN secret (Contents: read and write on userxx09-afk/prod).
name: Publish BCN release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['downloads/**']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check the APK
        id: v
        run: |
          name=$(jq -r .versionName downloads/latest.json)
          want=$(jq -r .sha256 downloads/latest.json)
          have=$(sha256sum downloads/BCN.apk | cut -d' ' -f1)
          if [ "$want" != "$have" ]; then
            echo "::error::downloads/BCN.apk doesn't match the sha256 in downloads/latest.json"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          jq -r .notes downloads/latest.json > notes.txt
          printf '\n\n**Install:** on the phone, tap **BCN.apk** below and open the download. If Android asks, allow installs from your browser. After this, BCN updates itself.\n\nNeeds Android 8 or newer.\n' >> notes.txt

      - name: Copy BCN into the prod repo
        env:
          PROD_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
        run: |
          if [ -z "$PROD_TOKEN" ]; then echo "::error::No PROD_REPO_TOKEN secret"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${PROD_TOKEN}@github.com/userxx09-afk/prod.git" prod
          mkdir -p prod/bcn prod/arlo
          cp downloads/BCN.apk downloads/latest.json prod/bcn/
          cp downloads/latest.json prod/arlo/latest.json      # for phones still on BAN
          cd prod
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bcn arlo
          git diff --cached --quiet || { git commit -m "BCN ${{ steps.v.outputs.name }} (from Arlo@${GITHUB_SHA::7})" && git push; }

      - name: Publish (or refresh) the release in prod
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          TAG: bcn-v${{ steps.v.outputs.name }}
        run: |
          PROD=userxx09-afk/prod
          if gh release view "$TAG" --repo "$PROD" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/BCN.apk --clobber --repo "$PROD"
          else
            gh release create "$TAG" downloads/BCN.apk --repo "$PROD" --target main --title "BCN ${{ steps.v.outputs.name }} for Android" --notes-file notes.txt --latest=false
          fi
          echo "Install: https://raw.githubusercontent.com/$PROD/main/bcn/BCN.apk" >> "$GITHUB_STEP_SUMMARY"
