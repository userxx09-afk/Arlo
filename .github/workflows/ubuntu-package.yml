# Packages Arlo Keeper for Ubuntu (ArloKeeper-linux.tar.gz: the server folder with its installer)
# and puts it on the "arlo-ubuntu" release in the public prod repo (this source repo is private).
# Download: https://github.com/userxx09-afk/prod/releases/download/arlo-ubuntu/ArloKeeper-linux.tar.gz
# Install or update on Ubuntu 22.04/24.04:
#   cd /tmp && curl -fLO https://github.com/userxx09-afk/prod/releases/download/arlo-ubuntu/ArloKeeper-linux.tar.gz
#   tar xzf ArloKeeper-linux.tar.gz && sudo bash arlo-keeper/deploy/install.sh && rm -rf arlo-keeper ArloKeeper-linux.tar.gz
# Needs the PROD_REPO_TOKEN secret (same as the Windows installer).
name: Ubuntu package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/app/**'
      - 'server/requirements.txt'
      - 'server/deploy/**'
      - '.github/workflows/ubuntu-package.yml'

permissions:
  contents: read

concurrency:
  group: ubuntu-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the code compiles
        run: python3 -m compileall -q server/app

      - name: Make ArloKeeper-linux.tar.gz
        run: |
          mkdir -p dist build/arlo-keeper
          cp -r server/app server/deploy server/requirements.txt server/.env.example server/README.md build/arlo-keeper/
          find build -name __pycache__ -prune -exec rm -rf {} +
          echo "$GITHUB_SHA" > build/arlo-keeper/BUILD
          tar czf dist/ArloKeeper-linux.tar.gz -C build arlo-keeper

      - uses: actions/upload-artifact@v4
        continue-on-error: true   # the release below is what counts; Actions storage can be full
        with:
          name: ArloKeeper-linux
          path: dist/ArloKeeper-linux.tar.gz

      - name: Publish to the arlo-ubuntu release in prod
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          GH_REPO: userxx09-afk/prod
        run: |
          tag=arlo-ubuntu
          cat > notes.md <<EOF
          **Arlo Keeper for Ubuntu** (22.04 / 24.04). Built from $GITHUB_SHA.

          Install or update (keeps clips, settings and the Arlo sign-in in /var/lib/arlo-keeper):

          \`\`\`
          cd /tmp && curl -fLO https://github.com/$GH_REPO/releases/download/$tag/ArloKeeper-linux.tar.gz
          tar xzf ArloKeeper-linux.tar.gz && sudo bash arlo-keeper/deploy/install.sh
          rm -rf arlo-keeper ArloKeeper-linux.tar.gz
          \`\`\`

          It runs as the systemd service arlo-keeper on port 8090. For ban.tapper.co see "DNS and addresses" in the README.
          EOF
          if gh release view $tag >/dev/null 2>&1; then
            gh release edit $tag --title "Arlo Keeper for Ubuntu" --notes-file notes.md --latest=false
          else
            gh release create $tag --title "Arlo Keeper for Ubuntu" --notes-file notes.md --latest=false --target main
          fi
          gh release upload $tag dist/ArloKeeper-linux.tar.gz --clobber
          echo "Download: https://github.com/$GH_REPO/releases/download/$tag/ArloKeeper-linux.tar.gz" >> $GITHUB_STEP_SUMMARY
